<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sets - Banco de Dados de Sets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
    
</head>
<body>

    <!-- Header Section -->
    <header class="hero-video-section text-center text-white">
        <div class="container py-5">
            <h1 class="display-4">Galeria de Sets</h1>
            <p class="lead">Escolha um set para ver mais detalhes sobre ele, incluindo cores, palavras-chave e uma descrição completa.</p>
        </div>
    </header>

    <!-- Sets Section -->
    <section id="sets" class="py-5">
        <div class="container">
            <div class="row">
                <!-- Set Card 1 -->
                <div class="col-md-4">
                    <div class="set-card" data-bs-toggle="modal" data-bs-target="#setModal" data-bs-img="galeria/unhas_barueri_nail_art_a (10).jpg" data-bs-desc="Unha Nail Art Vermelha com Azul" data-bs-primary-color="#FF5733" data-bs-secondary-color="#C70039" data-bs-keywords="Azul, Vermelho, Metal, Gel, 3d">
                        <img src="galeria/unhas_barueri_nail_art_a (10).jpg" alt="Set 1" class="img-fluid rounded">
                    </div>
                </div>
                <!-- Set Card 2 -->
                <div class="col-md-4">
                    <div class="set-card" data-bs-toggle="modal" data-bs-target="#setModal" data-bs-img="galeria/unhas_barueri_nail_art_a (6).jpg" data-bs-desc="Unha vermelha Completa" data-bs-primary-color="#33FF57" data-bs-secondary-color="#3399FF" data-bs-keywords="art, set, moderno">
                        <img src="galeria/unhas_barueri_nail_art_a (6).jpg" alt="Set 2" class="img-fluid rounded">
                    </div>
                </div>
                <!-- Set Card 3 -->
                <div class="col-md-4">
                    <div class="set-card" data-bs-toggle="modal" data-bs-target="#setModal" data-bs-img="galeria/unhas_barueri_nail_art_a (3).jpg" data-bs-desc="Descrição curta sobre o set 3" data-bs-primary-color="#900C3F" data-bs-secondary-color="#FF5733" data-bs-keywords="vintage, elegante, art">
                        <img src="galeria/unhas_barueri_nail_art_a (3).jpg" alt="Set 3" class="img-fluid rounded">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="setModal" tabindex="-1" aria-labelledby="setModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="setModalLabel">Detalhes do Set</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="setImage" src="" alt="Imagem do Set" class="img-fluid rounded mb-4">
                    <div id="setDetails" class="set-details">
                        <p id="setDesc"></p>
                        <p><strong>Cores:</strong> 
                            <span class="color-box" id="primaryColor"></span>
                            <span class="color-box" id="secondaryColor"></span>
                        </p>
                        <p><strong>Palavras-chave:</strong> <span id="keywords"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p><strong>Mariana Nails</strong></p>
            <p>Rua Maria Fernanda, 429, Jardim Graziela, Barueri, 06418-060</p>
            <p>Tel: +55 11 94459-8264</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Modal behavior
        document.querySelectorAll('.set-card').forEach(card => {
            card.addEventListener('click', function() {
                const imageSrc = this.getAttribute('data-bs-img');
                const description = this.getAttribute('data-bs-desc');
                const primaryColor = this.getAttribute('data-bs-primary-color');
                const secondaryColor = this.getAttribute('data-bs-secondary-color');
                const keywords = this.getAttribute('data-bs-keywords');

                document.getElementById('setImage').setAttribute('src', imageSrc);
                document.getElementById('setDesc').textContent = description;
                document.getElementById('primaryColor').style.backgroundColor = primaryColor;
                document.getElementById('secondaryColor').style.backgroundColor = secondaryColor;
                document.getElementById('keywords').textContent = keywords;
            });
        });
    </script>

</body>
</html>
